<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>Курьер: Домофоны и Адреса</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-inner: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --code-bg: #172554;
      --code-digit: #e0f2fe;
      --code-sym: #fbbf24;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 98px;
      line-height: 1.4;
    }

    /* Шапка и поиск */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      max-width: 680px;
      margin-left: auto;
      margin-right: auto;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats {
      font-size: 12px;
      color: var(--muted);
      background: var(--card);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn.accent-outline {
      border-color: rgba(56, 189, 248, 0.45);
      color: var(--accent);
    }

    .icon-btn:active {
      transform: scale(0.96);
    }

    .search-wrap {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
      padding: 11px 42px 11px 14px;
      border-radius: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--border);
      color: var(--text);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .clear-search.visible {
      display: flex;
    }

    /* Быстрые фильтры */
    .filter-bar {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      max-width: 680px;
      margin: 9px auto 0;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .filter-chip.active {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: var(--text);
    }

    /* Основной контейнер */
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Карточка дома */
    .building-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .building-header {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
    }

    .building-address {
      font-size: 17px;
      font-weight: 700;
      word-break: break-word;
    }

    .add-entrance-btn {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }

    .add-entrance-btn:active {
      transform: scale(0.96);
    }

    .entrances-list {
      display: flex;
      flex-direction: column;
    }

    .entrance-item {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.55);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entrance-item:last-child {
      border-bottom: none;
    }

    .entrance-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .entrance-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .entrance-badge {
      background: var(--card-inner);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }

    /* Оформление кода домофона: цифры светлые, буквы и спецсимволы жёлтые */
    .code-box {
      background: var(--code-bg);
      color: var(--code-digit);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 6px 13px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .code-box:active {
      transform: scale(0.96);
    }

    .code-tokens {
      display: inline-flex;
      align-items: center;
    }

    .code-digit {
      color: var(--code-digit);
    }

    .code-sym {
      color: var(--code-sym);
    }

    .copy-hint {
      font-size: 12px;
      opacity: 0.85;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-label {
      font-size: 11px;
      color: var(--muted);
      margin-right: 2px;
    }

    .mini-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 13px;
      cursor: pointer;
    }

    .mini-btn:active {
      transform: scale(0.95);
    }

    .mini-btn.del {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.35);
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-pill {
      font-size: 12px;
      background: rgba(148, 163, 184, 0.14);
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .note-text {
      font-size: 14px;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }

    .empty-state {
      text-align: center;
      padding: 52px 20px;
      color: var(--muted);
    }

    /* Кнопка добавления (FAB) */
    .fab {
      position: fixed;
      bottom: 20px;
      right: 16px;
      left: 16px;
      max-width: 648px;
      margin: 0 auto;
      background: var(--accent);
      color: #082f49;
      border: none;
      border-radius: 16px;
      padding: 15px 20px;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.45);
      cursor: pointer;
      z-index: 15;
    }

    .fab:active {
      transform: scale(0.98);
    }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      width: 100%;
      max-width: 680px;
      border-radius: 22px 22px 0 0;
      border-top: 1px solid var(--border);
      padding: 0 16px 26px;
      max-height: 90dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
      .modal {
        border-radius: 20px;
        border: 1px solid var(--border);
      }
    }

    .modal-header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--card);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 12px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.45);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 600;
    }

    input[type="text"], textarea {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
      padding: 11px 12px;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea.code-textarea {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      line-height: 1.35;
    }

    .address-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .addr-sug-chip {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .quick-symbols {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .sym-btn {
      flex: 1;
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--code-sym);
      font-weight: 800;
      font-size: 16px;
      padding: 9px 0;
      border-radius: 10px;
      cursor: pointer;
    }

    .sym-btn:active {
      background: var(--border);
    }

    .preset-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .preset-chip {
      background: var(--card-inner);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .preset-chip.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .save-btn {
      width: 100%;
      background: var(--accent);
      color: #082f49;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .save-btn:active {
      transform: scale(0.98);
    }

    /* Уведомление + кнопка отмены */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--success);
      color: #052e16;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transition: transform 0.22s ease;
      z-index: 100;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 92vw;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-undo {
      background: #052e16;
      color: #bbf7d0;
      border: none;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    /* Разделы модалки Код / Бэкап */
    .section-box {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .section-box:last-child {
      margin-bottom: 0;
    }

    .section-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .backup-info {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .backup-panel {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .backup-btn {
      width: 100%;
      padding: 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      display: block;
    }

    .backup-btn.primary {
      background: var(--accent);
      color: #082f49;
      border-color: var(--accent);
      font-weight: 800;
    }

    .backup-btn.danger-outline {
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      background: transparent;
      font-size: 13px;
    }

    .backup-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="title">🔑 База домофонов <span class="stats" id="statsBadge">0</span></div>
      <div class="header-actions">
        <button type="button" class="icon-btn accent-outline" id="openBackupBtn">📥 Код / База</button>
      </div>
    </div>
    <div class="search-wrap">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Поиск: улица, дом, подъезд или код..."
        autocomplete="off"
      />
      <button type="button" class="clear-search" id="clearSearchBtn" aria-label="Очистить">✕</button>
    </div>
    <div class="filter-bar" id="filterBar"></div>
  </header>

  <main id="listContainer"></main>

  <button type="button" class="fab" id="openAddBtn">+ Добавить адрес / код</button>

  <!-- Модалка добавления/редактирования записи -->
  <div class="modal-backdrop" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="formTitle">Новая запись</div>
        <button type="button" class="icon-btn" data-close-modal="formModal">✕</button>
      </div>

      <form id="entryForm">
        <input type="hidden" id="entryId" />

        <div class="form-group">
          <label for="addressInput">Адрес (улица, дом) *</label>
          <input
            type="text"
            id="addressInput"
            placeholder="Например: ул. Ленина, 15"
            autocomplete="off"
            required
          />
          <div class="address-suggestions" id="addressSuggestions"></div>
        </div>

        <div class="form-group">
          <label for="entranceInput">Подъезд</label>
          <input type="text" id="entranceInput" placeholder="2, Калитка, Двор..." />
        </div>

        <div class="form-group">
          <label for="codeInput">Код от домофона / ворот</label>
          <input type="text" id="codeInput" placeholder="Например: #4512 или 12К3456" autocomplete="off" />
          <div class="quick-symbols">
            <button type="button" class="sym-btn" data-sym="#">#</button>
            <button type="button" class="sym-btn" data-sym="*">*</button>
            <button type="button" class="sym-btn" data-sym="К">К</button>
            <button type="button" class="sym-btn" data-sym="В">В</button>
            <button type="button" class="sym-btn" data-sym="B">B</button>
          </div>
        </div>

        <div class="form-group">
          <label>Быстрые метки</label>
          <div class="preset-tags" id="presetTagsContainer"></div>
        </div>

        <div class="form-group">
          <label for="noteInput">Заметка (как пройти, охрана, нюансы)</label>
          <textarea id="noteInput" rows="2" placeholder="Вход со двора, дверь слева..."></textarea>
        </div>

        <button type="submit" class="save-btn">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Модалка загрузки по коду и резервного копирования -->
  <div class="modal-backdrop" id="backupModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Код базы и бэкап</div>
        <button type="button" class="icon-btn" data-close-modal="backupModal">✕</button>
      </div>

      <div class="section-box">
        <div class="section-heading">1. Загрузить адреса по коду</div>
        <p class="backup-info">
          Вставь код, полученный в чате или мессенджере (формат <code>KEYDB:...</code> или <code>[...]</code>). Новые адреса добавятся к твоим.
        </p>
        <div class="form-group" style="margin-bottom: 9px;">
          <textarea
            id="codeImportArea"
            class="code-textarea"
            rows="4"
            placeholder="Вставь сюда код базы..."
          ></textarea>
        </div>
        <button type="button" class="backup-btn primary" id="applyCodeBtn">✅ Загрузить адреса из кода</button>
      </div>

      <div class="section-box">
        <div class="section-heading">2. Сохранить бэкап или переслать</div>
        <p class="backup-info" id="backupInfoText">
          В памяти телефона: 0 записей.
        </p>
        <div class="backup-panel">
          <button type="button" class="backup-btn" id="copyCodeBtn">📋 Скопировать код для мессенджера (KEYDB)</button>
          <button type="button" class="backup-btn" id="exportFileBtn">⬇️ Скачать файлом на телефон (.json)</button>
          <label class="backup-btn" style="cursor:pointer;">
            ⬆️ Загрузить из файла (.json)
            <input type="file" id="importFileInput" accept=".json,application/json" style="display:none;" />
          </label>
          <button type="button" class="backup-btn danger-outline" id="clearAllBtn">🗑️ Очистить всю базу на телефоне</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastText">Скопировано!</span>
    <button type="button" class="toast-undo" id="toastUndoBtn" style="display:none;">Отменить</button>
  </div>

  <script>
    const STORAGE_KEY = 'courier_intercom_db_v1';
    const CODE_PREFIX = 'KEYDB:';

    const PRESET_TAGS = [
      '🔑 Вездеход',
      '🚧 Шлагбаум',
      '🚪 Калитка',
      '👮 Охрана / Консьерж',
      '📦 Оставлять у двери',
      '🐕 Собака',
      '⚠️ Не работает'
    ];
    const QUICK_FILTERS = ['Все', '🔑 Вездеход', '🚧 Шлагбаум', '🚪 Калитка', '⚠️ Не работает'];

    let entries = [];
    let selectedTags = new Set();
    let activeFilter = 'Все';
    let lastDeletedSnapshot = null;
    let clearConfirmPending = false;

    function attachManifest() {
      const manifest = {
        name: 'Курьер: База домофонов',
        short_name: 'Домофоны',
        start_url: '.',
        display: 'standalone',
        background_color: '#0f172a',
        theme_color: '#0f172a',
        icons: [{
          src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231e293b'/><text x='50' y='68' font-size='58' text-anchor='middle'>🔑</text></svg>",
          sizes: '192x192',
          type: 'image/svg+xml'
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    }

    function encodeBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function decodeBase64Utf8(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function normalizeText(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/ё/g, 'е')
        .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()«»"']/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function normalizeAddressKey(addr) {
      return normalizeText(addr)
        .replace(/\b(ул|улица|пер|переулок|пр|проспект|пр-т|ш|шоссе|б-р|бульвар|пл|площадь|д|дом)\b/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatShortDate(ts) {
      if (!ts) return '';
      const now = new Date();
      const d = new Date(ts);
      if (now.toDateString() === d.toDateString()) return 'сегодня';
      const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      return `${d.getDate()} ${months[d.getMonth()]}`;
    }

    function formatColoredCode(code) {
      return Array.from(String(code || '')).map(ch => {
        if (ch === ' ') return ' ';
        const isDigit = /^[0-9]$/.test(ch);
        const cls = isDigit ? 'code-digit' : 'code-sym';
        return `<span class="${cls}">${escapeHtml(ch)}</span>`;
      }).join('');
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) entries = parsed;
        }
      } catch (e) {
        entries = [];
      }
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function init() {
      attachManifest();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
      loadLocalState();
      bindEvents();
      renderFilterBar();
      renderPresetTags();
      renderList();
    }

    function bindEvents() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', () => {
        document.getElementById('clearSearchBtn').classList.toggle('visible', searchInput.value.length > 0);
        renderList();
      });

      document.getElementById('clearSearchBtn').addEventListener('click', () => {
        searchInput.value = '';
        document.getElementById('clearSearchBtn').classList.remove('visible');
        renderList();
        searchInput.focus();
      });

      document.getElementById('openAddBtn').addEventListener('click', () => openFormModal());
      document.getElementById('openBackupBtn').addEventListener('click', openBackupModal);
      document.getElementById('entryForm').addEventListener('submit', saveEntry);
      document.getElementById('addressInput').addEventListener('input', renderAddressSuggestions);

      document.querySelectorAll('#formModal input, #formModal textarea').forEach(el => {
        el.addEventListener('focus', () => {
          setTimeout(() => {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 260);
        });
      });

      document.getElementById('applyCodeBtn').addEventListener('click', handleCodeImport);
      document.getElementById('copyCodeBtn').addEventListener('click', copyShareableCode);
      document.getElementById('exportFileBtn').addEventListener('click', exportDataFile);
      document.getElementById('importFileInput').addEventListener('change', importDataFile);
      document.getElementById('clearAllBtn').addEventListener('click', handleClearAll);
      document.getElementById('toastUndoBtn').addEventListener('click', undoDelete);

      document.addEventListener('click', (e) => {
        const closeTarget = e.target.closest('[data-close-modal]');
        if (closeTarget) {
          closeModal(closeTarget.dataset.closeModal);
          return;
        }

        if (e.target.classList.contains('modal-backdrop')) {
          if (e.target.id === 'backupModal' && document.getElementById('codeImportArea').value.trim().length > 0) {
            return;
          }
          closeModal(e.target.id);
          return;
        }

        const filterChip = e.target.closest('[data-filter]');
        if (filterChip) {
          activeFilter = filterChip.dataset.filter;
          renderFilterBar();
          renderList();
          return;
        }

        const copyBtn = e.target.closest('[data-copy-code]');
        if (copyBtn) {
          copyText(copyBtn.dataset.copyCode, `Скопировано: ${copyBtn.dataset.copyCode}`);
          return;
        }

        const addEntBtn = e.target.closest('[data-add-address]');
        if (addEntBtn) {
          openFormModal(addEntBtn.dataset.addAddress);
          return;
        }

        const sugChip = e.target.closest('[data-pick-address]');
        if (sugChip) {
          const addrInput = document.getElementById('addressInput');
          addrInput.value = sugChip.dataset.pickAddress;
          renderAddressSuggestions();
          document.getElementById('entranceInput').focus();
          return;
        }

        const editBtn = e.target.closest('[data-edit-id]');
        if (editBtn) {
          editEntry(editBtn.dataset.editId);
          return;
        }

        const delBtn = e.target.closest('[data-delete-id]');
        if (delBtn) {
          deleteEntry(delBtn.dataset.deleteId);
          return;
        }

        const symBtn = e.target.closest('[data-sym]');
        if (symBtn) {
          const codeInput = document.getElementById('codeInput');
          codeInput.value += symBtn.dataset.sym;
          codeInput.focus();
          return;
        }

        const tagChip = e.target.closest('[data-tag]');
        if (tagChip) {
          const tag = tagChip.dataset.tag;
          if (selectedTags.has(tag)) selectedTags.delete(tag);
          else selectedTags.add(tag);
          renderPresetTags();
        }
      });
    }

    function renderFilterBar() {
      const bar = document.getElementById('filterBar');
      bar.innerHTML = QUICK_FILTERS.map(f => {
        const active = activeFilter === f ? 'active' : '';
        return `<button type="button" class="filter-chip ${active}" data-filter="${escapeAttr(f)}">${escapeHtml(f)}</button>`;
      }).join('');
    }

    function renderPresetTags() {
      const container = document.getElementById('presetTagsContainer');
      container.innerHTML = PRESET_TAGS.map(tag => {
        const active = selectedTags.has(tag) ? 'active' : '';
        return `<div class="preset-chip ${active}" data-tag="${escapeAttr(tag)}">${escapeHtml(tag)}</div>`;
      }).join('');
    }

    function renderAddressSuggestions() {
      const container = document.getElementById('addressSuggestions');
      const val = normalizeText(document.getElementById('addressInput').value);
      const uniqueMap = new Map();

      entries.forEach(item => {
        const key = normalizeAddressKey(item.address);
        if (key && !uniqueMap.has(key)) {
          uniqueMap.set(key, item.address.trim());
        }
      });

      const allAddresses = Array.from(uniqueMap.values());
      if (allAddresses.length === 0) {
        container.innerHTML = '';
        return;
      }

      const matches = allAddresses
        .filter(addr => !val || normalizeText(addr).includes(val))
        .filter(addr => normalizeText(addr) !== val)
        .slice(0, 4);

      container.innerHTML = matches
        .map(addr => `<button type="button" class="addr-sug-chip" data-pick-address="${escapeAttr(addr)}">📍 ${escapeHtml(addr)}</button>`)
        .join('');
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      const rawQuery = document.getElementById('searchInput').value;
      const normQuery = normalizeText(rawQuery);
      const queryTokens = normQuery.split(' ').filter(Boolean);
      const compactQuery = normQuery.replace(/\s+/g, '');

      const filtered = entries.filter(item => {
        if (activeFilter !== 'Все') {
          if (!item.tags || !item.tags.includes(activeFilter)) return false;
        }
        if (queryTokens.length === 0) return true;

        const haystack = normalizeText([
          item.address,
          item.entrance,
          item.code,
          item.note,
          ...(item.tags || [])
        ].join(' '));

        const compactHaystack = haystack.replace(/\s+/g, '');
        return queryTokens.every(token => haystack.includes(token)) || compactHaystack.includes(compactQuery);
      });

      document.getElementById('statsBadge').textContent = `${entries.length}`;

      if (filtered.length === 0) {
        const isFiltered = queryTokens.length > 0 || activeFilter !== 'Все';
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:42px; margin-bottom:10px;">${isFiltered ? '📭' : '🔐'}</div>
            <div style="font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px;">
              ${isFiltered ? 'Ничего не найдено' : 'База пуста'}
            </div>
            <div>${isFiltered
              ? 'Попробуй другой запрос, сбрось фильтр или добавь новый адрес кнопкой ниже.'
              : 'Добавь первый адрес вручную или вставь готовый код в разделе «📥 Код / База».'}</div>
          </div>
        `;
        return;
      }

      const groupsMap = new Map();
      const sorted = [...filtered].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

      sorted.forEach(item => {
        const key = normalizeAddressKey(item.address) || item.address.trim().toLowerCase();
        if (!groupsMap.has(key)) {
          groupsMap.set(key, {
            displayAddress: item.address.trim(),
            items: []
          });
        }
        groupsMap.get(key).items.push(item);
      });

      let html = '';
      groupsMap.forEach(group => {
        group.items.sort((a, b) => (a.entrance || '').localeCompare(b.entrance || '', 'ru', { numeric: true }));

        const itemsHtml = group.items.map(item => {
          const entranceLabel = item.entrance
            ? `Подъезд: <strong>${escapeHtml(item.entrance)}</strong>`
            : 'Основной';
          const dateStr = formatShortDate(item.updatedAt);

          const codeHtml = item.code
            ? `<div class="code-box" data-copy-code="${escapeAttr(item.code)}" title="Нажми, чтобы скопировать">
                <span class="code-tokens">${formatColoredCode(item.code)}</span>
                <span class="copy-hint">📋</span>
               </div>`
            : `<span style="color:var(--muted); font-size:13px;">Без кода</span>`;

          const tagsHtml = (item.tags && item.tags.length > 0)
            ? `<div class="tags-row">${item.tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>`
            : '';

          const noteHtml = item.note
            ? `<div class="note-text">${escapeHtml(item.note)}</div>`
            : '';

          return `
            <div class="entrance-item">
              <div class="entrance-main">
                <div class="entrance-left">
                  <span class="entrance-badge">${entranceLabel}</span>
                  ${codeHtml}
                </div>
                <div class="item-actions">
                  ${dateStr ? `<span class="date-label">${escapeHtml(dateStr)}</span>` : ''}
                  <button type="button" class="mini-btn" data-edit-id="${escapeAttr(item.id)}" title="Изменить">✏️</button>
                  <button type="button" class="mini-btn del" data-delete-id="${escapeAttr(item.id)}" title="Удалить">🗑️</button>
                </div>
              </div>
              ${tagsHtml}
              ${noteHtml}
            </div>
          `;
        }).join('');

        html += `
          <div class="building-card">
            <div class="building-header">
              <div class="building-address">📍 ${escapeHtml(group.displayAddress)}</div>
              <button type="button" class="add-entrance-btn" data-add-address="${escapeAttr(group.displayAddress)}">+ Подъезд</button>
            </div>
            <div class="entrances-list">
              ${itemsHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function openFormModal(prefillAddress = '') {
      document.getElementById('entryForm').reset();
      document.getElementById('entryId').value = '';
      document.getElementById('formTitle').textContent = prefillAddress
        ? 'Добавить подъезд / код'
        : 'Новый адрес';
      selectedTags = new Set();
      renderPresetTags();

      if (prefillAddress) {
        document.getElementById('addressInput').value = prefillAddress;
      }
      renderAddressSuggestions();

      document.getElementById('formModal').classList.add('open');
      setTimeout(() => {
        if (prefillAddress) {
          document.getElementById('entranceInput').focus();
        } else {
          document.getElementById('addressInput').focus();
        }
      }, 100);
    }

    function editEntry(id) {
      const item = entries.find(e => e.id === id);
      if (!item) return;

      document.getElementById('entryId').value = item.id;
      document.getElementById('formTitle').textContent = 'Редактировать запись';
      document.getElementById('addressInput').value = item.address || '';
      document.getElementById('entranceInput').value = item.entrance || '';
      document.getElementById('codeInput').value = item.code || '';
      document.getElementById('noteInput').value = item.note || '';

      selectedTags = new Set(item.tags || []);
      renderPresetTags();
      renderAddressSuggestions();

      document.getElementById('formModal').classList.add('open');
    }

    function saveEntry(e) {
      e.preventDefault();
      const id = document.getElementById('entryId').value;
      const address = document.getElementById('addressInput').value.trim();
      const entrance = document.getElementById('entranceInput').value.trim();
      const code = document.getElementById('codeInput').value.trim();
      const note = document.getElementById('noteInput').value.trim();
      const tags = Array.from(selectedTags);

      if (!address) return;

      if (id) {
        const idx = entries.findIndex(item => item.id === id);
        if (idx !== -1) {
          entries[idx] = {
            ...entries[idx],
            address,
            entrance,
            code,
            tags,
            note,
            updatedAt: Date.now()
          };
        }
        showToast('Запись обновлена');
      } else {
        entries.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          address,
          entrance,
          code,
          tags,
          note,
          updatedAt: Date.now()
        });
        showToast('Сохранено!');
      }

      saveToStorage();
      renderList();
      closeModal('formModal');
    }

    function deleteEntry(id) {
      lastDeletedSnapshot = [...entries];
      entries = entries.filter(item => item.id !== id);
      saveToStorage();
      renderList();
      showToast('Запись удалена', true);
    }

    function undoDelete() {
      if (!lastDeletedSnapshot) return;
      entries = lastDeletedSnapshot;
      lastDeletedSnapshot = null;
      saveToStorage();
      renderList();
      showToast('Запись восстановлена');
    }

    function copyText(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => showToast(successMsg))
          .catch(() => fallbackCopy(text, successMsg));
      } else {
        fallbackCopy(text, successMsg);
      }
    }

    function fallbackCopy(text, successMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(successMsg);
    }

    function showToast(msg, allowUndo = false) {
      const toast = document.getElementById('toast');
      const undoBtn = document.getElementById('toastUndoBtn');
      document.getElementById('toastText').textContent = msg;
      undoBtn.style.display = allowUndo ? 'inline-block' : 'none';

      toast.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        if (!allowUndo) lastDeletedSnapshot = null;
      }, allowUndo ? 5000 : 2200);
    }

    function openBackupModal() {
      clearConfirmPending = false;
      document.getElementById('clearAllBtn').textContent = '🗑️ Очистить всю базу на телефоне';
      document.getElementById('backupInfoText').textContent =
        `В памяти телефона сейчас: ${entries.length} зап.`;
      document.getElementById('backupModal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function parseCodePayload(rawInput) {
      const trimmed = String(rawInput || '').trim();
      if (!trimmed) throw new Error('Пустое поле');

      let jsonText = trimmed;
      if (trimmed.toUpperCase().startsWith(CODE_PREFIX)) {
        const b64 = trimmed.slice(CODE_PREFIX.length).replace(/\s+/g, '');
        jsonText = decodeBase64Utf8(b64);
      } else {
        jsonText = trimmed
          .replace(/[“”„]/g, '"')
          .replace(/[‘’]/g, "'");
      }

      const parsed = JSON.parse(jsonText);
      const list = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.items) ? parsed.items : null);
      if (!list) throw new Error('Неверный формат данных');

      return list
        .filter(item => item && (item.address || item.a))
        .map((item, idx) => ({
          id: String(item.id || `${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 5)}`),
          address: String(item.address || item.a || '').trim(),
          entrance: String(item.entrance || item.e || '').trim(),
          code: String(item.code || item.c || '').trim(),
          tags: Array.isArray(item.tags || item.t) ? (item.tags || item.t) : [],
          note: String(item.note || item.n || '').trim(),
          updatedAt: Number(item.updatedAt) || Date.now()
        }));
    }

    function mergeEntries(incomingList) {
      const byId = new Map(entries.map(item => [item.id, item]));
      const keyToId = new Map();

      entries.forEach(item => {
        const sig = `${normalizeAddressKey(item.address)}|${normalizeText(item.entrance)}`;
        keyToId.set(sig, item.id);
      });

      let added = 0;
      let updated = 0;

      incomingList.forEach(item => {
        const sig = `${normalizeAddressKey(item.address)}|${normalizeText(item.entrance)}`;
        const existingId = byId.has(item.id) ? item.id : keyToId.get(sig);

        if (existingId && byId.has(existingId)) {
          const prev = byId.get(existingId);
          byId.set(existingId, {
            ...prev,
            ...item,
            id: existingId,
            updatedAt: Date.now()
          });
          updated++;
        } else {
          byId.set(item.id, item);
          keyToId.set(sig, item.id);
          added++;
        }
      });

      entries = Array.from(byId.values());
      saveToStorage();
      renderList();
      return { added, updated };
    }

    function handleCodeImport() {
      const area = document.getElementById('codeImportArea');
      const raw = area.value.trim();
      if (!raw) {
        showToast('Сначала вставь код в поле');
        area.focus();
        return;
      }

      try {
        const imported = parseCodePayload(raw);
        if (imported.length === 0) {
          showToast('В коде не найдено адресов');
          return;
        }
        const { added, updated } = mergeEntries(imported);
        area.value = '';
        closeModal('backupModal');
        showToast(`Готово: +${added} нов., ${updated} обн.`);
      } catch (err) {
        alert('Не удалось прочитать код. Проверь, что он скопирован полностью без обрезанных краёв.');
      }
    }

    function copyShareableCode() {
      if (entries.length === 0) {
        showToast('База пока пуста — нечего копировать');
        return;
      }
      const compactPayload = CODE_PREFIX + encodeBase64Utf8(JSON.stringify(entries));
      copyText(compactPayload, `Код базы (${entries.length} зап.) скопирован!`);
    }

    function exportDataFile() {
      if (entries.length === 0) {
        showToast('База пока пуста');
        return;
      }
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `domofony_backup_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Файл бэкапа скачан');
    }

    function importDataFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = parseCodePayload(evt.target.result);
          const { added, updated } = mergeEntries(imported);
          closeModal('backupModal');
          showToast(`Файл загружен: +${added} нов., ${updated} обн.`);
        } catch (err) {
          alert('Ошибка: неверный формат файла резервной копии.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function handleClearAll() {
      if (entries.length === 0) {
        showToast('База уже пуста');
        return;
      }
      const btn = document.getElementById('clearAllBtn');
      if (!clearConfirmPending) {
        clearConfirmPending = true;
        btn.textContent = '⚠️ Нажми ещё раз для полного удаления';
        return;
      }
      entries = [];
      saveToStorage();
      renderList();
      closeModal('backupModal');
      showToast('База на телефоне очищена');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    init();
  </script>
</body>
</html>
